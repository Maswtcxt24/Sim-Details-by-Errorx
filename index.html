<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمبر نیٹ ورک چیکر</title>
<style>
:root{--bg:#eef3f1;--ink:#14302b;--card:#fff;--accent:#0f766e;--muted:#5b716c;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b18;--ink:#e6f2ef;--card:#17302b;--accent:#2dd4bf;--muted:#9bb5af;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font-family:"Noto Nastaliq Urdu","Segoe UI",Tahoma,sans-serif;line-height:1.9}
main{width:100%;max-width:440px;background:var(--card);border-radius:18px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
h1{margin:0 0 6px;font-size:1.5rem}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
input{width:100%;padding:14px;border:2px solid var(--accent);border-radius:12px;font-size:1.1rem;background:transparent;color:var(--ink);direction:ltr;text-align:left}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:1.05rem;cursor:pointer}
button:disabled{opacity:.6}
#out{margin-top:20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.25)}
.row b{color:var(--muted);font-weight:600}
.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>نمبر نیٹ ورک چیکر</h1>
  <p class="sub">موبائل نمبر درج کریں اور نیٹ ورک معلوم کریں۔</p>
  <input id="q" type="tel" inputmode="numeric" placeholder="03XXXXXXXXX" maxlength="13" aria-label="موبائل نمبر">
  <button id="go">نیٹ ورک دیکھیں</button>
  <div id="out" aria-live="polite"></div>
</main>
<script>
const API = "https://wasifali.biz.id/public_apis/sim-info-api.php?search=";

// Sirf yeh safe fields dikhai jayengi. Naam, address, CNIC wagera kabhi show nahi hongay.
const SAFE = [
  ["network","نیٹ ورک"],["operator","نیٹ ورک"],["carrier","نیٹ ورک"],["company","کمپنی"],
  ["type","قسم"],["region","علاقہ"],["country","ملک"]
];

const q = document.getElementById("q"), out = document.getElementById("out"), btn = document.getElementById("go");

function show(html, cls){ out.innerHTML = '<div class="'+(cls||"")+'">'+html+'</div>'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function pick(obj, found = []){
  if (!obj || typeof obj !== "object") return found;
  for (const [k, label] of SAFE){
    for (const key of Object.keys(obj)){
      if (key.toLowerCase() === k && typeof obj[key] !== "object" && obj[key] !== "")
        if (!found.some(f => f[0] === label)) found.push([label, obj[key]]);
    }
  }
  for (const v of Object.values(obj)) if (v && typeof v === "object") pick(v, found);
  return found;
}

async function lookup(){
  const num = q.value.replace(/[\s-]/g, "");
  if (!/^(\+92|0092|92|0)?3\d{9}$/.test(num)) return show("درست پاکستانی موبائل نمبر لکھیں، مثلاً 03001234567۔", "err");
  btn.disabled = true; show("تلاش جاری ہے…");
  try{
    const r = await fetch(API + encodeURIComponent(num));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = pick(await r.json());
    if (!rows.length) return show("اس نمبر کے لیے نیٹ ورک کی معلومات نہیں ملیں۔");
    show(rows.map(([a,b]) => '<div class="row"><b>'+esc(a)+'</b><span>'+esc(b)+'</span></div>').join(""));
  }catch(e){
    show("API سے رابطہ نہیں ہو سکا۔ اگر API میں CORS کھلا نہیں ہے تو براؤزر اسے بلاک کر دیتا ہے۔", "err");
  }finally{ btn.disabled = false; }
}
btn.addEventListener("click", lookup);
q.addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
</script>
</body>
</html>
